name: NextPerf CI

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze-bundle:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Checkout the Main branch first to establish the baseline
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Install Base Dependencies
        run: npm install

      - name: Build Base
        run: |
          npm run build
          mv .next .next-base

      # 2. Checkout the PR Branch second
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          clean: false # This is critical: It tells Git NOT to delete the .next-base folder we just built!

      - name: Install PR Dependencies
        run: npm install

      - name: Build PR
        run: |
          npm run build
          mv .next .next-pr

      # 3. Run the diff engine (diff-engine.ts now safely exists because we are on the PR branch)
      - name: Run NextPerf Engine
        id: nextperf
        run: |
          npm install -g tsx
          npx tsx diff-engine.ts > nextperf-report.md
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "report<<$EOF" >> $GITHUB_OUTPUT
          cat nextperf-report.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # 4. Post the comment directly to the PR
      - name: Post PR Comment
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.nextperf.outputs.report }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = process.env.REPORT;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.body.includes('NextPerf CI'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }